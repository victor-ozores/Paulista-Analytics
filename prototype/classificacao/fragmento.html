<style>
#clx{--disp:"Arial Black","Segoe UI Black","Segoe UI",Arial,sans-serif;--gold:#ffd166;--mut:#9aa6b8;--txt:#e6ecf5;--ver:#2fd47a;--verc:#79e7a6;--verm:#ff5470;--vermc:#ff8a95;--ciano:#4cc9f0;--rox:#b388ff;position:relative;width:100%;height:100%;min-height:320px;overflow:hidden;background:#05070a;color:#fff;font-family:"Segoe UI",Arial,sans-serif;-webkit-user-select:none;user-select:none;outline:0}

#clx .kpis{position:absolute;left:0;top:100px;width:1920px;height:108px}

#clx .kpi h4{margin:0;font-size:16px;letter-spacing:.1em;color:var(--mut);font-weight:800;text-transform:uppercase;white-space:nowrap}

#clx .pn{position:absolute;padding:14px 22px 0;background:linear-gradient(180deg,rgba(15,20,29,.94),rgba(7,9,13,.98));border:1px solid rgba(255,255,255,.14);border-top:4px solid #fff;clip-path:polygon(0 0,100% 0,100% calc(100% - 22px),calc(100% - 22px) 100%,0 100%)}
#clx .pn h3{margin:0 0 8px;height:30px;display:flex;justify-content:space-between;align-items:center;font:italic 900 24px/1 var(--disp);text-transform:uppercase;white-space:nowrap}

#clx .p2{left:1020px;top:220px;width:854px;height:410px}

#clx .th,#clx .tr{display:grid;grid-template-columns:44px 218px 54px 46px 46px 46px 46px 54px 54px 60px 78px 54px 54px;column-gap:4px;align-items:center}

#clx .zg{display:flex;gap:30px;margin-top:10px;font-size:16px;font-weight:700;color:var(--mut)}
#clx .zg span::before{content:"";display:inline-block;width:14px;height:14px;margin-right:8px;vertical-align:-2px;transform:skewX(-14deg)}

#clx .br{position:relative;width:810px;height:334px;margin-top:2px}

#clx .gm{position:absolute;width:250px;height:76px;padding:2px 8px 0;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.16);border-left:4px solid rgba(255,255,255,.3);cursor:help;opacity:0;transition:opacity .35s,border-color .15s;transition-delay:calc(var(--i)*70ms),0s}
#clx .pn.on .gm{opacity:1}
#clx .gm.sel{border-color:var(--ciano);background:rgba(76,201,240,.12)}
#clx .gm.sem{opacity:.34!important}
#clx .gm em{display:block;font-style:normal;font-size:16px;line-height:18px;font-weight:700;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#clx .tl{display:flex;align-items:center;gap:8px;width:100%;height:27px;font-size:17px;font-weight:700;color:#aeb8c8;white-space:nowrap}
#clx .tl:hover{background:rgba(255,255,255,.08)}
#clx .tl img{width:20px;height:20px;object-fit:contain;flex:none}
#clx .tl .sg{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;font-size:16px;font-weight:900;color:#10141b;flex:none}
#clx .tl u{text-decoration:none;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
#clx .tl b{font-weight:900;font-size:18px;font-variant-numeric:tabular-nums}

#clx .tl.w{color:#fff}
#clx .tl.w b{color:var(--verc)}

#clx .fn{position:absolute;width:250px;height:176px;padding:2px 8px 0;background:rgba(255,209,102,.08);border:1px solid rgba(255,209,102,.5);border-left:4px solid var(--gold);cursor:help;opacity:0;transition:opacity .35s,border-color .15s;transition-delay:.5s,0s}
#clx .pn.on .fn{opacity:1}
#clx .fn.sel{border-color:var(--ciano)}
#clx .fn.sem{opacity:.34!important}

#clx .fn .lg{display:flex;gap:8px;align-items:center;height:26px;font-size:16px;font-weight:700;color:#d6deea;white-space:nowrap}
#clx .fn .lg span{color:var(--mut)}
#clx .fn .lg b{font-weight:900;font-variant-numeric:tabular-nums}
#clx .fn .pt{margin-top:2px;font-size:16px;font-weight:700;color:var(--mut)}
#clx .fn .pt b{color:#fff}
#clx .fn .cp{display:flex;align-items:center;gap:8px;margin-top:6px;height:40px;padding:0 8px;background:rgba(255,209,102,.18);color:var(--gold);font-size:17px;font-weight:800;white-space:nowrap}
#clx .fn .cp img{width:26px;height:26px;object-fit:contain}
#clx .fn .cp .sg{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;font-size:16px;font-weight:900;color:#10141b}
#clx .fn .cp u{text-decoration:none;overflow:hidden;text-overflow:ellipsis}
#clx .bp{position:relative;width:810px;height:268px}
#clx .bp svg{display:block;overflow:visible}
#clx .bp text{font-family:"Segoe UI",Arial,sans-serif;font-size:16px;font-weight:700;fill:var(--mut)}
#clx .bp text.q{fill:var(--verc)}
#clx .bp text.r{fill:var(--vermc)}
#clx .bp .ln{fill:none;stroke:rgba(154,166,184,.55);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;transition:opacity .15s}
#clx .bp .ln.sel{stroke:var(--ciano);stroke-width:5;opacity:1}
#clx .bp .ln.sem{opacity:.2}
#clx .bp .pt{fill:#0c1118;stroke:rgba(154,166,184,.8);stroke-width:2}
#clx .bp .pt.sel{stroke:var(--ciano);fill:var(--ciano)}
#clx .bp .pt.sem{opacity:.2}
#clx .bp .hit{fill:none;stroke:transparent;stroke-width:12;stroke-linecap:round;stroke-linejoin:round;cursor:pointer;pointer-events:stroke}
#clx .bp .ln,#clx .bp .pt{pointer-events:none}
#clx .bp .fim{cursor:pointer}
#clx .bp .fim.sem{opacity:.3}
#clx .bp .bq{fill:rgba(47,212,122,.07)}
#clx .bp .br2{fill:rgba(255,84,112,.1)}
#clx .rod{position:absolute;left:0;top:988px;width:1920px;height:36px;z-index:12;display:flex;justify-content:space-between;align-items:center;padding:0 46px;font-size:16px;color:var(--mut);background:linear-gradient(0deg,rgba(0,0,0,.55),transparent)}
#clx .rod b{color:#c3ccda;font-weight:600}
#clx .rod span:first-child{cursor:help}
#clx .tip{position:absolute;left:0;top:0;max-width:470px;z-index:60;padding:12px 16px;background:rgba(10,13,19,.97);border:1px solid rgba(255,255,255,.28);border-left:4px solid var(--gold);box-shadow:0 10px 30px rgba(0,0,0,.6);font-size:17px;line-height:1.4;color:var(--txt);opacity:0;pointer-events:none;transition:opacity .12s}
#clx .tip.on{opacity:1}
#clx .tip b{display:block;color:var(--gold);font-size:19px;margin-bottom:4px}
#clx .tip>span{display:block;margin-top:6px}
#clx .tip .tv{display:grid;gap:3px;margin-top:4px;padding:8px 12px;background:rgba(255,255,255,.07);border-left:3px solid rgba(255,255,255,.25)}
#clx .tip .tv div{display:flex;justify-content:space-between;gap:28px}
#clx .tip .tv div em{font-style:normal;font-weight:800;color:#fff;text-align:right}
#clx .tip small{display:block;margin-top:8px;font-size:16px;color:var(--mut)}
#clx .aj{position:absolute;left:0;top:0;width:1920px;height:1024px;z-index:55;display:none;background:rgba(3,5,8,.84);align-items:center;justify-content:center}
#clx .aj.on{display:flex}
#clx .aj .cx{width:1400px;padding:34px 44px 28px;background:linear-gradient(180deg,#161c27,#0c1017);border:1px solid rgba(255,255,255,.22);border-top:5px solid var(--gold);display:grid;grid-template-columns:1fr 1fr;gap:20px 52px}
#clx .aj h2{grid-column:1 / span 2;margin:0;font:italic 900 34px var(--disp);text-transform:uppercase}
#clx .aj h3{margin:0 0 10px;font-size:18px;letter-spacing:.12em;color:var(--gold);text-transform:uppercase}
#clx .aj ol{margin:0;padding-left:26px}
#clx .aj li{font-size:19px;line-height:1.45;color:var(--txt);margin:0 0 10px}
#clx .aj dl{margin:0}
#clx .aj dt{font-weight:800;color:#fff;font-size:19px}
#clx .aj dd{margin:0 0 9px;font-size:18px;line-height:1.4;color:#c3ccda}
#clx .aj .fe{grid-column:1 / span 2;display:flex;justify-content:flex-end;align-items:center}
#clx .aj .fe button{padding:10px 26px;font-size:17px;font-weight:800;border:1px solid var(--gold);background:var(--gold);color:#12151c}
#clx.go .kpi,#clx.go .pn{animation:cl-sobe .55s both}
#clx.go .kpi:nth-child(2){animation-delay:.06s}
#clx.go .kpi:nth-child(3){animation-delay:.12s}
#clx.go .kpi:nth-child(4){animation-delay:.18s}
#clx.go .kpi:nth-child(5){animation-delay:.24s}
#clx.go .kpi:nth-child(6){animation-delay:.3s}
#clx.go .kpi:nth-child(7){animation-delay:.36s}
#clx.go .p1{animation-delay:.3s}
#clx.go .p2{animation-delay:.4s}
#clx.go .p3{animation-delay:.5s}
#clx.rm *{animation:none!important;transition:none!important}
@keyframes cl-sobe{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
</style>
<div id="clx" tabindex="0">
<div class="palco"><div class="fundo"></div><div class="faixa"></div><div class="tit">Classificação <b>e</b> chave</div><div class="sub"></div><div class="ctl"></div><div class="kpis"></div><div class="pn p1"></div><div class="pn p2"></div><div class="pn p3"></div><div class="rod"></div><div class="aj" role="dialog" aria-modal="true" aria-label="Como ler esta tela"></div><div class="tip"></div></div>
</div>
<script>
(function(){
var D=__DADOS__;
var raiz=document.getElementById('clx'),palco=raiz.querySelector('.palco'),tipEl=raiz.querySelector('.tip'),ajEl=raiz.querySelector('.aj');
var EL={sub:raiz.querySelector('.sub'),ctl:raiz.querySelector('.ctl'),kpis:raiz.querySelector('.kpis'),p1:raiz.querySelector('.p1'),p2:raiz.querySelector('.p2'),p3:raiz.querySelector('.p3'),rod:raiz.querySelector('.rod')};
var COR={ciano:'#4cc9f0',verde:'#2fd47a',verdeClaro:'#79e7a6',vermelho:'#ff5470',amarelo:'#ffd166',roxo:'#b388ff',cinza:'#9aa6b8'};
var M=D.meta,CL={},LG={},TAB={};
D.clubes.forEach(function(c){CL[c.id]=c});
D.tab.forEach(function(t){TAB[t.c]=t});
if(window.PA&&window.PA.clubes)window.PA.clubes.forEach(function(c){LG[c.id]=c.logo});
var CRIT={v:'vitórias',sg:'saldo de gols',gp:'gols marcados',cv:'cartões vermelhos',ca:'cartões amarelos'};
var FASE={2:'Quartas de final',3:'Semifinal',4:'Final'};
var NR=D.tab.length;
var est={sel:null,k:1,ox:0,oy:0};
var reduzido=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
if(reduzido)raiz.classList.add('rm');
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function num(n){return Number(n).toLocaleString('pt-BR')}
function dec(n,c){return Number(n).toLocaleString('pt-BR',{minimumFractionDigits:c,maximumFractionDigits:c})}
function pc(a,b){return b>0?dec(100*a/b,1)+'%':'—'}
function sinal(n){return n>0?'+'+num(n):n<0?'−'+num(-n):'0'}
function dataBR(d){var p=d.split('-');return p[2]+'/'+p[1]}
function dataLonga(d){var p=d.split('-');return p[2]+'/'+p[1]+'/'+p[0]}
function plural(n,u,p){return num(n)+' '+(n===1?u:p)}
function nomeLista(a){return a.length<2?(a[0]||''):a.slice(0,-1).join(', ')+' e '+a[a.length-1]}
function tp(){return' data-tip="'+Array.prototype.slice.call(arguments).map(esc).join('||')+'"'}
function linhasTip(l){return'@'+l.map(function(x){return x[0]+'::'+x[1]}).join('\n')}
function tipHtml(s){
var sec=String(s).split('||'),h='<b>'+esc(sec[0])+'</b>';
for(var i=1;i<sec.length;i++){
var x=sec[i];if(!x)continue;
if(x.charAt(0)==='@')h+='<div class="tv">'+x.slice(1).split('\n').map(function(l){var p=l.split('::');return'<div><span>'+esc(p[0])+'</span><em>'+esc(p[1]===undefined?'':p[1])+'</em></div>'}).join('')+'</div>';
else if(x.charAt(0)==='~')h+='<small>'+esc(x.slice(1))+'</small>';
else h+='<span>'+esc(x)+'</span>';
}
return h;
}
function nome(id){return CL[id].curto}
function logo(id,t){
var c=CL[id];
if(LG[id])return'<img src="'+LG[id]+'" alt=""'+(t?' style="width:'+t+'px;height:'+t+'px"':'')+'>';
return'<span class="sg" style="background:'+c.cor+(t?';width:'+t+'px;height:'+t+'px':'')+'">'+esc(c.sigla.charAt(0))+'</span>';
}
function zona(p){return p<=M.nq?'q':p>NR-M.nr?'r':''}
function jogosDe(id){return D.mm.filter(function(j){return j.m===id||j.v===id}).sort(function(a,b){return a.n-b.n})}
function placar(j){return j.gm+' × '+j.gv+(j.pm!==null?' (pênaltis '+j.pm+' a '+j.pv+')':'')}
function caminho(id){
var l=jogosDe(id).filter(function(j){return j.f<4}).map(function(j){
var adv=j.m===id?j.v:j.m,venceu=j.w===id;
return[FASE[j.f],(venceu?'passou':'caiu')+' contra '+nome(adv)+' ('+placar(j)+')'];
});
var fin=jogosDe(id).filter(function(j){return j.f===4});
if(fin.length){var camp=M.camp===id;l.push(['Final',(camp?'campeão':'vice')+', '+(camp?M.fpts[0]+' a '+M.fpts[1]:M.fpts[1]+' a '+M.fpts[0])+' em pontos contra '+nome(camp?M.vice:M.camp)])}
return l;
}
function fraseDesempate(g){
return g.pares.map(function(p){
var f=function(c,v){return c==='sg'?sinal(v):num(v)};
var ant=p.iguais.length?', depois de empatar em '+nomeLista(p.iguais.map(function(c){return CRIT[c]}))+' ('+f(p.iguais[0],TAB[p.a][p.iguais[0]])+' a '+f(p.iguais[0],TAB[p.b][p.iguais[0]])+')':'';
return nome(p.a)+' ficou à frente de '+nome(p.b)+' no critério '+CRIT[p.c]+' ('+f(p.c,p.va)+' a '+f(p.c,p.vb)+')'+ant;
}).join('. ')+'.';
}
function grupoEmpate(id){return D.emp.filter(function(g){return g.ids.indexOf(id)>=0})[0]}
function dicaClube(id){
var t=TAB[id],z=zona(t.p),g=grupoEmpate(id),cam=caminho(id),lin=[['Pontos',num(t.pt)+' em '+plural(t.j,'jogo','jogos')],['Vitórias, empates, derrotas',t.v+' · '+t.e+' · '+t.d],['Gols pró e contra',t.gp+' e '+t.gc+' (saldo '+sinal(t.sg)+')'],['Aproveitamento',pc(t.pt,3*t.j)],['Cartões','amarelos '+t.ca+' · vermelhos '+t.cv]];
var sit=z==='q'?'Classificado às quartas de final.':z==='r'?'Rebaixado à A2 de 2027.':'Ficou fora do mata-mata e não caiu.';
var arr=[nome(id)+' · '+t.p+'º lugar na 1ª fase',linhasTip(lin),sit];
if(g)arr.push('Desempate: '+fraseDesempate({pares:g.pares.filter(function(p){return p.a===id||p.b===id})}));
if(cam.length)arr.push(linhasTip(cam));
arr.push('~Clique para destacar este clube na tabela, no chaveamento e no gráfico.');
return arr;
}
function itensKpi(){
