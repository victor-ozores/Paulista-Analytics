#cnx .aj.on{display:flex}
#cnx .aj .cx{width:1400px;padding:34px 44px 28px;background:linear-gradient(180deg,#161c27,#0c1017);border:1px solid rgba(255,255,255,.22);border-top:5px solid var(--gold);display:grid;grid-template-columns:1fr 1fr;gap:20px 52px}

#cnx.go .kpi,#cnx.go .pn{animation:cn-sobe .55s both}

#cnx.go .kpi:nth-child(3){animation-delay:.12s}
#cnx.go .kpi:nth-child(4){animation-delay:.18s}
#cnx.go .kpi:nth-child(5){animation-delay:.24s}
#cnx.go .kpi:nth-child(6){animation-delay:.3s}
#cnx.go .kpi:nth-child(7){animation-delay:.36s}
#cnx.go .p1{animation-delay:.3s}

#cnx.rm *{animation:none!important;transition:none!important}
@keyframes cn-sobe{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
</style>
<div id="cnx" tabindex="0">
<div class="palco"><div class="fundo"></div><div class="faixa"></div><div class="tit">Conferência <b>e</b> fontes</div><div class="sub"></div><div class="ctl"></div><div class="kpis"></div><div class="pn p1"></div><div class="pn p2"></div><div class="pn p3"></div><div class="pn p4"></div><div class="pn p5"></div><div class="rod"></div><div class="aj" role="dialog" aria-modal="true" aria-label="Como ler esta tela"></div><div class="tip"></div></div>
</div>
<script>
(function(){
var D=__DADOS__;
var raiz=document.getElementById('cnx'),palco=raiz.querySelector('.palco'),tipEl=raiz.querySelector('.tip'),ajEl=raiz.querySelector('.aj');
var EL={sub:raiz.querySelector('.sub'),ctl:raiz.querySelector('.ctl'),kpis:raiz.querySelector('.kpis'),p1:raiz.querySelector('.p1'),p2:raiz.querySelector('.p2'),p3:raiz.querySelector('.p3'),p4:raiz.querySelector('.p4'),p5:raiz.querySelector('.p5'),rod:raiz.querySelector('.rod')};
var COR={ciano:'#4cc9f0',verde:'#2fd47a',verdeClaro:'#79e7a6',vermelho:'#ff5470',amarelo:'#ffd166',cinza:'#9aa6b8'};
var RES={ok:['Sem ocorrência','ok'],explicada:['Explicada','ex'],aberta:['Aberta','ab'],info:['Informativa','in']};
var STS={aberta:['Aberta','ab'],explicada:['Explicada','ex'],aceita:['Aceita','ac'],corrigida:['Corrigida','co']};
var ORD_ST=['aberta','explicada','aceita','corrigida'];
var SEV={alta:'Alta',media:'Média',baixa:'Baixa'};
var RESPL={ok:'sem ocorrência',explicada:'explicadas',aberta:'abertas',info:'informativas'};
var BADGE={o:['Oficial','ok'],n:['Não oficial','ex'],p:['Projeto','ac']};
var M=D.meta,REG={};
D.reg.forEach(function(r){REG[r.c]=r});
var est={res:'t',st:'t',sel:null,k:1,ox:0,oy:0};
var reduzido=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
if(reduzido)raiz.classList.add('rm');
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function num(n){return Number(n).toLocaleString('pt-BR')}
function pc(a,b){return b>0?Number(100*a/b).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0})+'%':'—'}
function dataBR(d){var p=d.split('-');return p[2]+'/'+p[1]+'/'+p[0]}
function plural(n,u,p){return num(n)+' '+(n===1?u:p)}
function tp(){return' data-tip="'+Array.prototype.slice.call(arguments).map(esc).join('||')+'"'}
function linhasTip(l){return'@'+l.map(function(x){return x[0]+'::'+x[1]}).join('\n')}
function tipHtml(s){
var sec=String(s).split('||'),h='<b>'+esc(sec[0])+'</b>';
for(var i=1;i<sec.length;i++){
var x=sec[i];if(!x)continue;
if(x.charAt(0)==='@')h+='<div class="tv">'+x.slice(1).split('\n').map(function(l){var p=l.split('::');return'<div><span>'+esc(p[0])+'</span><em>'+esc(p[1]===undefined?'':p[1])+'</em></div>'}).join('')+'</div>';
else if(x.charAt(0)==='~')h+='<small>'+esc(x.slice(1))+'</small>';
else h+='<span>'+esc(x)+'</span>';
}
return h;
}
function ocDe(cod){return D.oc.filter(function(o){return o.r===cod})}
function regrasFiltradas(){return D.reg.filter(function(r){return est.res==='t'||r.r===est.res})}
function baseOcorr(){return est.sel?ocDe(est.sel):D.oc.filter(function(o){return est.res==='t'||REG[o.r].r===est.res})}
function ocorrFiltradas(){
var l=baseOcorr().filter(function(o){return est.st==='t'||o.st===est.st});
return l.sort(function(a,b){return ORD_ST.indexOf(a.st)-ORD_ST.indexOf(b.st)||(a.i<b.i?-1:a.i>b.i?1:0)});
}
function contaRes(){var c={t:D.reg.length};D.reg.forEach(function(r){c[r.r]=(c[r.r]||0)+1});return c}
function contaSt(){var c={t:0};baseOcorr().forEach(function(o){c.t++;c[o.st]=(c[o.st]||0)+1});return c}
function temFiltro(){return!!est.sel||est.res!=='t'||est.st!=='t'}
function limparTudo(){est.sel=null;est.res='t';est.st='t'}
function itensKpi(){
var abertas=D.reg.filter(function(r){return r.r==='aberta'}).map(function(r){return r.c}),infos=D.reg.filter(function(r){return r.r==='info'}).map(function(r){return r.c});
var decididas=M.ocorr-(M.st.aberta||0);
return[
{r:'Regras',c:COR.ciano,v:M.regras,s:num(M.itens)+' itens verificados',t:['Regras de conferência','Cada regra compara duas fontes ou confere uma propriedade dos dados: somas que fecham, minutos plausíveis, vínculos sem sobra.',linhasTip([['Regras',num(M.regras)],['Itens verificados',num(M.itens)],['Ocorrências no log',num(M.ocorr)]])]},
{r:'Sem ocorrência',c:COR.verde,v:M.ok,s:pc(M.ok,M.regras)+' das regras',t:['Sem ocorrência','Regras em que tudo que foi verificado bateu: nenhuma divergência apareceu.']},
{r:'Explicadas',c:COR.amarelo,v:M.expl,s:plural(decididas,'ocorrência decidida','ocorrências decididas'),t:['Explicadas','Regras que acharam divergências com causa conhecida. Cada caso foi decidido (explicada, aceita ou corrigida) com a explicação escrita; quando as fontes divergem, vale a oficial.',linhasTip(ORD_ST.filter(function(k){return M.st[k]}).map(function(k){return[STS[k][0]+'s',num(M.st[k])]}))]},
{r:'Em aberto',c:COR.vermelho,v:M.aber,s:abertas.join(' e '),t:['Em aberto','Pendências sem solução com as fontes que existem. Não são erros nos números da tela: são limites conhecidos, listados sem esconder.',linhasTip(abertas.map(function(c){return[c,REG[c].t]}))]},
{r:'Informativa',c:COR.cinza,v:M.info,s:infos.join(', ')+' · não é erro',t:['Informativa','Regra que só mostra um número para comparação entre fontes e não aponta erro.',linhasTip(infos.map(function(c){return[c,REG[c].t]}))]},
{r:'Placares × FPF',c:COR.verdeClaro,v:M.placar[0],suf:'de '+M.placar[1],s:'jogos iguais à FPF',t:['Placares × tabela da FPF','O placar final de cada jogo na súmula oficial contra a tabela oficial da FPF.']},
{r:'Posições × FPF',c:COR.verdeClaro,v:M.classif[0],suf:'de '+M.classif[1],s:'clubes na mesma posição',t:['Posições × classificação da FPF','A ordem da 1ª fase calculada pelo Art. 16 do regulamento contra a posição oficial de cada clube.']}
];
}
function kpisHtml(){
return itensKpi().map(function(k,i){
return'<div class="kpi" style="left:'+(46+i*263)+'px;--kc:'+k.c+'"'+tp.apply(null,k.t.concat(['~Resumo de toda a conferência; os filtros da tela não mudam este número.']))+'><h4>'+esc(k.r)+'</h4><div class="v"><span data-i="'+i+'">'+num(k.v)+'</span>'+(k.suf?'<em>'+esc(k.suf)+'</em>':'')+'</div><small>'+esc(k.s)+'</small></div>';
}).join('');
}
function contar(el,alvo,dur){
if(reduzido||dur<=0){el.textContent=num(alvo);return}
var t0=performance.now();
(function f(t){var k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=num(Math.round(alvo*e));if(k<1)requestAnimationFrame(f)})(t0);
}
function kpis(){
EL.kpis.innerHTML=kpisHtml();
if(!reduzido)itensKpi().forEach(function(k,i){var el=EL.kpis.querySelector('span[data-i="'+i+'"]');contar(el,k.v,900)});
}

function montarAjuda(){
ajEl.innerHTML='<div class="cx"><h2>Como ler esta tela</h2><div><h3>Passo a passo</h3><ol><li>Os sete quadros de cima resumem o resultado das '+M.regras+' regras de conferência.</li><li>Em <b>As regras</b>, escolha o resultado (Todas, Sem ocorrência, Explicadas, Abertas ou Info): as duas listas passam a mostrar só essas regras e as ocorrências delas. Clique em uma regra para ver só o que ela achou; clique de novo para soltar.</li><li>Em <b>As ocorrências</b>, escolha o status. As pendências abertas vêm primeiro. Passe o mouse em uma linha para ler o que cada fonte diz, a decisão e a explicação.</li><li>Os sete quadros de cima resumem toda a conferência e não mudam com os filtros. À direita: de onde vem cada dado, as camadas de conferência e a correção documentada. Limpar (ou a tecla Esc) solta a regra e os filtros.</li></ol></div><div><h3>Palavras que aparecem</h3><dl><dt>Regra</dt><dd>Uma conferência automática: compara duas fontes ou confere uma propriedade dos dados.</dd><dt>Item verificado</dt><dd>Cada jogo, clube, evento ou linha que a regra olhou.</dd><dt>Ocorrência</dt><dd>Um caso em que as fontes divergem ou um dado falta.</dd><dt>Explicada, aceita, corrigida</dt><dd>Explicada: causa conhecida, vale a fonte oficial. Aceita: limitação conhecida. Corrigida: valor ajustado na base com fonte citada.</dd><dt>Aberta</dt><dd>Sem solução com as fontes que existem. Não é erro nos números da tela.</dd><dt>Informativa</dt><dd>Mostra um número para comparação; não aponta erro.</dd><dt>Oficial, não oficial, projeto</dt><dd>Oficial é da FPF. Não oficial é da ESPN. Projeto é classificação feita aqui.</dd></dl></div><div class="fe"><button data-act="ajuda-fechar"'+tp('Fechar','Fecha este passo a passo. Também fecham as teclas Esc, Enter e espaço, ou um clique fora da janela.')+'>Entendi</button></div></div>';

else setTimeout(function(){PAIN.forEach(function(p){EL[p].classList.add('on')})},40);

function ajustar(){
var w=raiz.clientWidth,h=raiz.clientHeight;if(!w||!h)return;
var k=Math.min(w/1920,h/1024);
est.k=k;est.ox=Math.round((w-1920*k)/2);est.oy=Math.round((h-1024*k)/2);
palco.style.transform='translate('+est.ox+'px,'+est.oy+'px) scale('+k+')';
}
window.addEventListener('resize',ajustar);
if(window.ResizeObserver)new ResizeObserver(ajustar).observe(raiz);
ajustar();setTimeout(ajustar,60);setTimeout(ajustar,400);
function pontoPalco(ev){var r=raiz.getBoundingClientRect();return[(ev.clientX-r.left-est.ox)/est.k,(ev.clientY-r.top-est.oy)/est.k]}
var tipT=null,tipAlvo=null;
function mostrarTip(alvo,ev){
var s=alvo.getAttribute('data-tip');if(!s)return;
tipEl.innerHTML=tipHtml(s);
tipEl.classList.add('on');
posTip(ev,alvo);
}
function posTip(ev,alvo){
var pt;
if(ev&&typeof ev.clientX==='number')pt=pontoPalco(ev);
else{var r=alvo.getBoundingClientRect(),q=raiz.getBoundingClientRect();pt=[(r.left+r.width/2-q.left-est.ox)/est.k,(r.top+r.height-q.top-est.oy)/est.k-8]}
var w=tipEl.offsetWidth,h=tipEl.offsetHeight,x=pt[0]+22,y=pt[1]+26;
if(x+w>1908)x=pt[0]-w-22;
if(x<12)x=12;
if(y+h>1012)y=pt[1]-h-18;
if(y<12)y=12;
tipEl.style.left=Math.round(x)+'px';tipEl.style.top=Math.round(y)+'px';
}
function esconderTip(){clearTimeout(tipT);tipAlvo=null;tipEl.classList.remove('on')}
function acao(a,id,v){
if(a==='res'){est.res=v;if(est.sel&&v!=='t'&&REG[est.sel].r!==v)est.sel=null;atualizar({semAnimar:true})}
else if(a==='st'){est.st=v;atualizar({semAnimar:true,manterRolo:true})}
else if(a==='regra'){if(!REG[id]||(est.res!=='t'&&REG[id].r!==est.res))return;est.sel=est.sel===id?null:id;est.st='t';atualizar({semAnimar:true,manterRolo:true})}
else if(a==='limpar'){limparTudo();atualizar()}
else if(a==='ajuda')ajuda(true);
else if(a==='ajuda-fechar')ajuda(false);
}
raiz.addEventListener('click',function(ev){
var alvo=ev.target,t=alvo.closest&&alvo.closest('[data-act]'),dentro=alvo.closest&&alvo.closest('.cx');
if(ajEl.classList.contains('on')&&!dentro){ajuda(false);return}
if(!t)return;
acao(t.getAttribute('data-act'),t.getAttribute('data-id'),t.getAttribute('data-v'));
esconderTip();
raiz.focus({preventScroll:true});
});
raiz.addEventListener('mouseover',function(ev){
var d=ev.target.closest&&ev.target.closest('[data-tip]');
if(d!==tipAlvo){tipAlvo=d;clearTimeout(tipT);if(d){tipT=setTimeout(function(){mostrarTip(d,ev)},90)}else tipEl.classList.remove('on')}
});
raiz.addEventListener('mousemove',function(ev){if(tipAlvo&&tipEl.classList.contains('on'))posTip(ev,tipAlvo)});
raiz.addEventListener('mouseleave',esconderTip);
raiz.addEventListener('focusin',function(ev){
var d=ev.target.closest&&ev.target.closest('[data-tip]');
if(d&&d!==tipAlvo&&ev.target!==raiz){tipAlvo=d;mostrarTip(d,null)}
});
raiz.addEventListener('focusout',esconderTip);
raiz.addEventListener('touchstart',function(ev){
var d=ev.target.closest&&ev.target.closest('[data-tip]');
if(d&&d!==tipAlvo){tipAlvo=d;var tc=ev.touches&&ev.touches[0];mostrarTip(d,tc?{clientX:tc.clientX,clientY:tc.clientY}:null)}
else if(!d)esconderTip();
},{passive:true});
function tecla(k,ctrl){
if(k==='?'||(k==='h'&&!ctrl)){ajuda();return true}
if(ajEl.classList.contains('on')){if(k==='Escape'||k==='Enter'||k===' '){ajuda(false);return true}return false}
if((k==='Escape'||k==='Backspace')&&temFiltro()){if(est.sel)est.sel=null;else{est.res='t';est.st='t'}atualizar({semAnimar:true,manterRolo:true});return true}
return false;
}
document.addEventListener('keydown',function(ev){
if(!raiz.offsetParent)return;
if(tecla(ev.key,ev.ctrlKey||ev.metaKey))ev.preventDefault();
});
var goT=null;
function entrar(){
clearTimeout(goT);
raiz.classList.remove('go');
void raiz.offsetWidth;
raiz.classList.add('go');
goT=setTimeout(function(){raiz.classList.remove('go')},1500);
ajustar();
atualizar();
}

else entrar();
if(/[?&]debug/.test(location.search))window.__cnx={D:D,REG:REG,est:est,RES:RES,STS:STS,acao:acao,tecla:tecla,atualizar:atualizar,tipHtml:tipHtml,itensKpi:itensKpi,kpisHtml:kpisHtml,regrasFiltradas:regrasFiltradas,ocorrFiltradas:ocorrFiltradas,contaRes:contaRes,contaSt:contaSt,temFiltro:temFiltro,limparTudo:limparTudo,painelRegras:painelRegras,painelOcorr:painelOcorr,controles:controles};
