#dsx .lg2{display:flex;gap:22px;margin-top:8px;font-size:16px;font-weight:700;color:var(--mut)}

#dsx .rod{position:absolute;left:0;top:988px;width:1920px;height:36px;z-index:12;display:flex;justify-content:space-between;align-items:center;padding:0 46px;font-size:16px;color:var(--mut);background:linear-gradient(0deg,rgba(0,0,0,.55),transparent)}

#dsx .tip .tv div em{font-style:normal;font-weight:800;color:#fff;text-align:right}
#dsx .tip small{display:block;margin-top:8px;font-size:16px;color:var(--mut)}
#dsx .aj{position:absolute;left:0;top:0;width:1920px;height:1024px;z-index:55;display:none;background:rgba(3,5,8,.84);align-items:center;justify-content:center}
#dsx .aj.on{display:flex}
#dsx .aj .cx{width:1400px;padding:34px 44px 28px;background:linear-gradient(180deg,#122120,#0a1110);border:1px solid rgba(255,255,255,.22);border-top:5px solid var(--gold);display:grid;grid-template-columns:1fr 1fr;gap:20px 52px}
#dsx .aj h2{grid-column:1 / span 2;margin:0;font:italic 900 34px var(--disp);text-transform:uppercase}

#dsx .aj .fe{grid-column:1 / span 2;display:flex;justify-content:flex-end;align-items:center}
#dsx .aj .fe button{padding:10px 26px;font-size:17px;font-weight:800;border:1px solid var(--gold);background:var(--gold);color:#12151c}
#dsx.go .kpi,#dsx.go .pn{animation:ds-sobe .55s both}
#dsx.go .kpi:nth-child(2){animation-delay:.05s}
#dsx.go .kpi:nth-child(3){animation-delay:.1s}
#dsx.go .kpi:nth-child(4){animation-delay:.15s}
#dsx.go .kpi:nth-child(5){animation-delay:.2s}
#dsx.go .kpi:nth-child(6){animation-delay:.25s}
#dsx.go .p1{animation-delay:.3s}
#dsx.go .p2{animation-delay:.38s}
#dsx.go .p3{animation-delay:.46s}
#dsx.go .p4{animation-delay:.54s}

#dsx.rm *{animation:none!important;transition:none!important}
@keyframes ds-sobe{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
</style>
<div id="dsx" tabindex="0">
<div class="palco"><div class="fundo"></div><div class="faixa"></div><div class="tit">Disciplina <b>e</b> arbitragem</div><div class="sub"></div><div class="ctl"></div><div class="kpis"></div><div class="pn p1"></div><div class="pn p2"></div><div class="pn p3"></div><div class="pn p4"></div><div class="pn p5"></div><div class="rod"></div><div class="aj" role="dialog" aria-modal="true" aria-label="Como ler esta tela"></div><div class="tip"></div></div>
</div>
<script>
(function(){
var D=__DADOS__;
var raiz=document.getElementById('dsx'),palco=raiz.querySelector('.palco'),tipEl=raiz.querySelector('.tip'),ajEl=raiz.querySelector('.aj');
var EL={sub:raiz.querySelector('.sub'),ctl:raiz.querySelector('.ctl'),kpis:raiz.querySelector('.kpis'),p1:raiz.querySelector('.p1'),p2:raiz.querySelector('.p2'),p3:raiz.querySelector('.p3'),p4:raiz.querySelector('.p4'),p5:raiz.querySelector('.p5'),rod:raiz.querySelector('.rod')};
var COR={ciano:'#4cc9f0',verde:'#2fd47a',amarelo:'#ffd166',vermelho:'#ff5470',roxo:'#b388ff',teal:'#2ec4b6'};
var CL={},LG={},IJ={},CJ={};
D.clubes.forEach(function(c){CL[c.id]=c});
D.jogos.forEach(function(j){IJ[j.n]=j;CJ[j.n]={a:0,r:0}});
D.cart.forEach(function(x){if(x.t==='a')CJ[x.j].a++;else CJ[x.j].r++});
if(window.PA&&window.PA.clubes)window.PA.clubes.forEach(function(c){LG[c.id]=c.logo});
var FS={t:'Todas as fases',p:'1ª fase',m:'Mata-mata'};
var FX={t:function(){return true},p:function(j){return j.f===1},m:function(j){return j.f>1}};
var FAIXAS=['01-15','16-30','31-45','46-60','61-75','76-90+'];
var FAIXA_NOME=['1 a 15','16 a 30','31 a 45','46 a 60','61 a 75','76 a 90 e acréscimos'];
var est={fase:'t',clube:null,k:1,ox:0,oy:0};
var reduzido=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
if(reduzido)raiz.classList.add('rm');
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function num(n){return Number(n).toLocaleString('pt-BR')}
function dec(n,c){return Number(n).toLocaleString('pt-BR',{minimumFractionDigits:c,maximumFractionDigits:c})}
function pc(a,b){return b>0?dec(100*a/b,1)+'%':'—'}
function dataBR(d){var p=d.split('-');return p[2]+'/'+p[1]}
function plural(n,u,p){return num(n)+' '+(n===1?u:p)}
function tp(){return' data-tip="'+Array.prototype.slice.call(arguments).map(esc).join('||')+'"'}
function linhasTip(l){return'@'+l.map(function(x){return x[0]+'::'+x[1]}).join('\n')}
function tipHtml(s){
var sec=String(s).split('||'),h='<b>'+esc(sec[0])+'</b>';
for(var i=1;i<sec.length;i++){
var x=sec[i];if(!x)continue;
if(x.charAt(0)==='@')h+='<div class="tv">'+x.slice(1).split('\n').map(function(l){var p=l.split('::');return'<div><span>'+esc(p[0])+'</span><em>'+esc(p[1]===undefined?'':p[1])+'</em></div>'}).join('')+'</div>';
else if(x.charAt(0)==='~')h+='<small>'+esc(x.slice(1))+'</small>';
else h+='<span>'+esc(x)+'</span>';
}
return h;
}
function nome(id){return CL[id].curto}
function logo(id,t){
var c=CL[id];
if(LG[id])return'<img src="'+LG[id]+'" alt=""'+(t?' style="width:'+t+'px;height:'+t+'px"':'')+'>';
return'<span class="sg" style="background:'+c.cor+(t?';width:'+t+'px;height:'+t+'px':'')+'">'+esc(c.sigla.charAt(0))+'</span>';
}
function jogoTxt(j){return nome(j.m)+' '+j.gm+' × '+j.gv+' '+nome(j.v)}
function nosJogos(f,c){return D.jogos.filter(function(j){return FX[f](j)&&(c===null||j.m===c||j.v===c)})}
function cartoesDe(f,c){return D.cart.filter(function(x){return FX[f](IJ[x.j])&&(c===null||x.c===c)})}
function faixaDe(mn){return mn<=15?0:mn<=30?1:mn<=45?2:mn<=60?3:mn<=75?4:5}
function resumo(f,c){
var js=nosJogos(f,c),cs=cartoesDe(f,c),n=js.length;
var a=0,v=0,s=0,sem=0,com=0,fx=[0,0,0,0,0,0],fa=[0,0,0,0,0,0],fv=[0,0,0,0,0,0],cv={};
cs.forEach(function(x){
if(x.t==='a')a++;else if(x.t==='v')v++;else s++;
if(x.f===1)com++;
if(x.t!=='a')cv[x.j]=1;
if(x.mn===null){sem++;return}
var i=faixaDe(x.mn);fx[i]++;if(x.t==='a')fa[i]++;else fv[i]++;
});
var red=v+s;
return{n:n,a:a,v:v,s:s,red:red,tot:a+red,cpj:n?(a+red)/n:0,jcv:Object.keys(cv).length,com:com,sem:sem,fx:fx,fa:fa,fv:fv};
}
function porFase(fn){return[['Todas as fases',fn(resumo('t',est.clube))],['1ª fase',fn(resumo('p',est.clube))],['Mata-mata',fn(resumo('m',est.clube))]]}
function rotulo(){return est.clube===null?FS[est.fase]:nome(est.clube)+' · '+FS[est.fase]}
function itensKpi(){
var c=est.clube,r=resumo(est.fase,c),com=c!==null;
var nota='~Este número muda com o filtro de fase'+(com?' e é o do clube escolhido':'; com um clube escolhido ele passa a ser só dos cartões desse clube')+'.';
return[
{r:'Amarelos',c:COR.amarelo,v:num(r.a),s:pc(r.a,r.tot)+' dos cartões',t:['Cartões amarelos','Advertências, pela regra da FPF: o primeiro amarelo de quem foi expulso por segundo amarelo não conta como amarelo (conta junto com o vermelho).',linhasTip(porFase(function(x){return num(x.a)})),nota]},
{r:'Vermelhos',c:COR.vermelho,v:num(r.red),s:num(r.v)+' diretos e '+num(r.s)+' por 2º amarelo',t:['Cartões vermelhos','Vermelhos diretos mais as expulsões por segundo amarelo, pela regra da FPF.',linhasTip(porFase(function(x){return num(x.red)})),nota]},
{r:'Cartões por jogo',c:COR.teal,v:dec(r.cpj,2),s:com?'do clube por jogo dele':'média do recorte',t:['Cartões por jogo','Amarelos mais vermelhos, divididos pelos jogos do recorte.',linhasTip(porFase(function(x){return dec(x.cpj,2)})),nota]},
