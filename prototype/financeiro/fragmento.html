ajEl.innerHTML='<div class="cx"><h2>Como ler esta tela</h2><div><h3>Passo a passo</h3><ol><li>Os sete quadros de cima somam os jogos do recorte escolhido. Comece trocando a fase (Todas, 1ª fase ou Mata-mata).</li><li>Clique em um ou mais clubes na lista: a tela inteira passa a mostrar só os jogos deles. Clique de novo para tirar um clube; Limpar solta tudo.</li><li>O botão Clube como diz se os clubes entram pelos jogos em casa, fora ou nos dois.</li><li>O botão amarelo Filtros abre mais opções: clubes, rodada, dia da semana, horário, estádio e jogos no prejuízo ou com lucro. A janela mostra o resultado de cada escolha na hora.</li><li>Clique em um jogo da lista para ver só aquele jogo; ao mudar qualquer filtro, o jogo é solto. Passe o mouse em qualquer número, fatia, barra ou linha para ver o que significa e o valor exato.</li></ol></div><div><h3>Palavras que aparecem</h3><dl><dt>Público</dt><dd>Ingressos vendidos, pagos e gratuitos por lei, como no boletim financeiro oficial.</dd><dt>Renda bruta, despesas e renda líquida</dt><dd>O que a bilheteria arrecadou, o que o jogo custou e a diferença. A líquida pode ser negativa: é o prejuízo.</dd><dt>Ticket médio</dt><dd>Renda bruta dividida pelos ingressos pagos.</dd><dt>Categorias de ingresso</dt><dd>Agrupamento do projeto (não oficial) feito pelo nome do setor e do tipo de ingresso.</dd><dt>Deduções e líquido a receber</dt><dd>Descontos que o boletim aplica antes de o clube mandante receber a renda líquida.</dd><dt>Torcida visitante</dt><dd>Ingressos em setores cujo nome cita visitante.</dd><dt>Taxa de ocupação</dt><dd>Não aparece porque nenhuma fonte traz a capacidade dos estádios.</dd></dl></div><div class="fe"><button data-act="ajuda-fechar"'+tp('Fechar','Fecha este passo a passo. Também fecham as teclas Esc, Enter e espaço, ou um clique fora da janela.')+'>Entendi</button></div></div>';

function ajuda(abrir){
if(abrir===undefined)abrir=!ajEl.classList.contains('on');
if(abrir)esconderTip();
ajEl.classList.toggle('on',abrir);
}
function montarRodape(){
EL.rod.innerHTML='<span'+tp('Como os dados foram conferidos','Os números vêm dos boletins financeiros oficiais da FPF, lidos linha a linha. Em cada jogo, a soma dos ingressos é o público, a soma da arrecadação é a renda bruta e as despesas fecham com o total do boletim.',linhasTip([['Regras de conferência',M.regras],['Sem divergência',M.ok],['Divergência explicada',M.expl],['Em aberto',M.aber],['Informativa',M.info]]))+'>Dados: boletins financeiros oficiais da FPF · <b>conferidos por '+M.regras+' regras</b> ('+M.aber+' pendências abertas)</span><span>Categorias de ingresso e grupos de despesa são do projeto, não oficiais · Projeto independente, sem vínculo com a FPF</span>';
}
function acao(a,id,v){
if(a==='fase'){est.fase=+v;est.jogo=null;atualizar()}
else if(a==='como'){est.como=v;if(est.clubes.length)est.jogo=null;atualizar()}
else if(a==='metrica'){est.metrica=v;atualizar({semAnimar:true})}
else if(a==='rank'){est.rank=v;atualizar({semAnimar:true,manterRolo:true})}
else if(a==='ord'){if(est.ord===v)est.dir=-est.dir;else{est.ord=v;est.dir=v==='d'?1:-1}atualizar({semAnimar:true})}
else if(a==='clube'){
var i=est.clubes.indexOf(id);
if(i>=0)est.clubes.splice(i,1);
else{var r=porClube().filter(function(x){return x.c.id===id})[0];if(!r||!r.n)return;est.clubes.push(id)}
est.jogo=null;atualizar();
}
else if(a==='jogo'){if(est.jogo===id)est.jogo=null;else if(JG[id]&&noFiltro(JG[id],{jogo:true}))est.jogo=id;else return;atualizar({manterRolo:true})}
else if(a==='limpar'||a==='f-limpar'){limparTudo();atualizar()}
else if(a==='filtros')filtros(true);
else if(a==='f-fechar')filtros(false);
else if(a==='f-rod'){alternar(est.rodadas,+v);est.rodadas.sort(porNumero);est.jogo=null;atualizar()}
else if(a==='f-dia'){alternar(est.dias,+v);est.dias.sort(porNumero);est.jogo=null;atualizar()}
else if(a==='f-hora'){alternar(est.horas,v);est.horas.sort();est.jogo=null;atualizar()}
else if(a==='f-est'){alternar(est.estadios,v);est.estadios.sort();est.jogo=null;atualizar()}
else if(a==='f-res'){est.res=+v;est.jogo=null;atualizar()}
else if(a==='ajuda')ajuda(true);
else if(a==='ajuda-fechar')ajuda(false);
}
raiz.addEventListener('click',function(ev){
var alvo=ev.target,t=alvo.closest&&alvo.closest('[data-act]'),dentro=alvo.closest&&alvo.closest('.cx');
if(ajEl.classList.contains('on')&&!dentro){ajuda(false);return}
if(fdEl.classList.contains('on')&&!dentro){filtros(false);return}
if(!t)return;
acao(t.getAttribute('data-act'),t.getAttribute('data-id'),t.getAttribute('data-v'));
esconderTip();
raiz.focus({preventScroll:true});
});
raiz.addEventListener('mouseover',function(ev){
var d=ev.target.closest&&ev.target.closest('[data-tip]');
if(d!==tipAlvo){tipAlvo=d;clearTimeout(tipT);if(d){tipT=setTimeout(function(){mostrarTip(d,ev)},90)}else tipEl.classList.remove('on')}
});
raiz.addEventListener('mousemove',function(ev){if(tipAlvo&&tipEl.classList.contains('on'))posTip(ev,tipAlvo)});
raiz.addEventListener('mouseleave',esconderTip);
raiz.addEventListener('focusin',function(ev){
var d=ev.target.closest&&ev.target.closest('[data-tip]');
if(d&&d!==tipAlvo&&ev.target!==raiz){tipAlvo=d;mostrarTip(d,null)}
});
raiz.addEventListener('focusout',esconderTip);
raiz.addEventListener('touchstart',function(ev){
var d=ev.target.closest&&ev.target.closest('[data-tip]');
if(d&&d!==tipAlvo){tipAlvo=d;var tc=ev.touches&&ev.touches[0];mostrarTip(d,tc?{clientX:tc.clientX,clientY:tc.clientY}:null)}
else if(!d)esconderTip();
},{passive:true});
function tecla(k,ctrl){
if(fdEl.classList.contains('on')){if(k==='Escape'){filtros(false);return true}return false}
if(k==='?'||(k==='h'&&!ctrl)){ajuda();return true}
if(ajEl.classList.contains('on')){if(k==='Escape'||k==='Enter'||k===' '){ajuda(false);return true}return false}
if((k==='Escape'||k==='Backspace')&&(est.jogo||est.clubes.length)){if(est.jogo)est.jogo=null;else est.clubes=[];atualizar({manterRolo:true});return true}
return false;
}
document.addEventListener('keydown',function(ev){
if(!raiz.offsetParent)return;
if(tecla(ev.key,ev.ctrlKey||ev.metaKey))ev.preventDefault();
});
var goT=null;
function entrar(){
clearTimeout(goT);
raiz.classList.remove('go');
void raiz.offsetWidth;
raiz.classList.add('go');
goT=setTimeout(function(){raiz.classList.remove('go')},1500);
ajustar();
atualizar();
}
montarAjuda();montarRodape();
atualizar({semAnimar:true});
if(window.PA&&window.PA.shell)window.PA.mods.fin={entrar:entrar};
else entrar();
if(/[?&]debug/.test(location.search))window.__fnx={D:D,CL:CL,JG:JG,est:est,COR:COR,OPC:OPC,PAPEL:PAPEL,filtrar:filtrar,somar:somar,descricao:descricao,KP:KP,corKpi:corKpi,kpisHtml:kpisHtml,fmtKpi:fmtKpi,categorias:categorias,cascata:cascata,cascataItens:cascataItens,acao:acao,tecla:tecla,aplicar:aplicar,despesas:despesas,ranking:ranking,lista:lista,dialogo:dialogo,resumoDlg:resumoDlg,porClube:porClube,jogosOrdenados:jogosOrdenados,atualizar:atualizar,tipHtml:tipHtml,mi:mi,reais:reais,limparTudo:limparTudo,nFiltros:nFiltros,temFiltro:temFiltro,unidade:unidade,RK:RK,OR:OR,controles:controles,filtros:filtros};
})();
</script>
