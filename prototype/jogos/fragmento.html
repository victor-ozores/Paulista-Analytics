function raias(itens,larg){
var fim=[],n=0;
itens.sort(function(a,b){return a.x-b.x});
itens.forEach(function(it){
var r=0;
while(r<fim.length&&it.x-larg/2<fim[r]+2)r++;
fim[r]=it.x+larg/2;
it.raia=r;
if(r+1>n)n=r+1;
});
return n;
}

function montarAjuda(){
ajEl.innerHTML='<div class="cx"><h2>Como ler esta tela</h2><div><h3>Passo a passo</h3><ol><li>À esquerda, a lista dos jogos: filtre por <b>rodada</b>, <b>clube</b> (escudos) e <b>resultado</b> e clique em um jogo. As setas para cima e para baixo do teclado passam de um jogo para o outro.</li><li>Em cima, a ficha: placar, rodada, data, estádio e árbitro. A <b>linha do jogo</b> mostra gols, cartões e trocas nos minutos (mandante em cima, visitante embaixo).</li><li>Embaixo, as <b>escalações</b> (titulares e banco), os <b>lances</b> (gols e cartões em ordem) e, nas abas, público e renda, arbitragem e estatísticas.</li><li>Os botões de fase também filtram a lista. <b>Limpar</b> ou a tecla Esc soltam os filtros (resultado, clube, rodada e, por último, a fase).</li></ol></div><div><h3>Palavras que aparecem</h3><dl><dt>Titular e banco</dt><dd>A súmula traz os 11 titulares e os reservas de cada time, sem posição em campo nem formação.</dd><dt>Troca</dt><dd>Seta para baixo é a saída e seta para cima é a entrada, com o minuto; "int." é troca no intervalo. A troca por concussão fica marcada na dica.</dd><dt>Cartões</dt><dd>Pela regra da FPF: o primeiro amarelo de quem foi expulso por segundo amarelo não conta; a expulsão conta como vermelho.</dd><dt>ESPN, não oficial</dt><dd>As estatísticas dos times vêm da ESPN, não da súmula da FPF.</dd></dl></div><div class="fe"><button data-act="ajuda-fechar"'+tp('Fechar','Fecha este passo a passo. Também fecham as teclas Esc, Enter e espaço, ou um clique fora da janela.')+'>Entendi</button></div></div>';

function ajuda(abrir){

ajEl.classList.toggle('on',abrir);
}
function marcarRolagem(e){var w=e.parentNode;if(w&&w.classList)w.classList.toggle('mais',e.scrollHeight-e.scrollTop-e.clientHeight>2)}
function ajustarRolagem(){var l=raiz.querySelectorAll('.rola');for(var i=0;i<l.length;i++)marcarRolagem(l[i])}
function ajustarLista(salvo){
var rl=raiz.querySelector('.p1 .rola'),l=lista(),k=0;
for(var i=0;i<l.length;i++)if(l[i].n===est.jogo)k=i;
var topo=salvo;
if(k*ROW<topo)topo=k*ROW;
if((k+1)*ROW>topo+LISTA_H)topo=(k+1)*ROW-LISTA_H;
if(topo<0)topo=0;
rl.scrollTop=topo;
}
function atualizar(){
esconderTip();
var rl=raiz.querySelector('.p1 .rola'),salvo=rl&&typeof rl.scrollTop==='number'?rl.scrollTop:0;
controles();cabecalho();

EL.p3.innerHTML=bloco3();
EL.p4.innerHTML=bloco4();
EL.p5.innerHTML=bloco5();
EL.p6.innerHTML=bloco6();

}
function ajustar(){
var w=raiz.clientWidth,h=raiz.clientHeight;if(!w||!h)return;
var k=Math.min(w/1920,h/1024);
est.k=k;est.ox=Math.round((w-1920*k)/2);est.oy=Math.round((h-1024*k)/2);
palco.style.transform='translate('+est.ox+'px,'+est.oy+'px) scale('+k+')';
}
window.addEventListener('resize',ajustar);
if(window.ResizeObserver)new ResizeObserver(ajustar).observe(raiz);
ajustar();setTimeout(ajustar,60);setTimeout(ajustar,400);
function pontoPalco(ev){var r=raiz.getBoundingClientRect();return[(ev.clientX-r.left-est.ox)/est.k,(ev.clientY-r.top-est.oy)/est.k]}
var tipT=null,tipAlvo=null;
function mostrarTip(alvo,ev){
var s=alvo.getAttribute('data-tip');if(!s)return;
tipEl.innerHTML=tipHtml(s);
tipEl.classList.add('on');
posTip(ev,alvo);
}
function posTip(ev,alvo){
var pt;
if(ev&&typeof ev.clientX==='number')pt=pontoPalco(ev);
else{var r=alvo.getBoundingClientRect(),q=raiz.getBoundingClientRect();pt=[(r.left+r.width/2-q.left-est.ox)/est.k,(r.top+r.height-q.top-est.oy)/est.k-8]}
var w=tipEl.offsetWidth,h=tipEl.offsetHeight,x=pt[0]+22,y=pt[1]+26;
if(x+w>1908)x=pt[0]-w-22;
if(x<12)x=12;
if(y+h>1012)y=pt[1]-h-18;
if(y<12)y=12;
tipEl.style.left=Math.round(x)+'px';tipEl.style.top=Math.round(y)+'px';
}
function esconderTip(){clearTimeout(tipT);tipAlvo=null;tipEl.classList.remove('on')}
function mover(d){
var l=lista(),k=0;
for(var i=0;i<l.length;i++)if(l[i].n===est.jogo)k=i;
var n=Math.max(0,Math.min(l.length-1,k+d));
if(n===k)return false;
est.jogo=l[n].n;
atualizar();
return true;
}
function acao(a,id,v){
if(a==='fase'){
if(!Object.prototype.hasOwnProperty.call(FS,v))return;
est.fase=v;
normalizar();
atualizar();
}
else if(a==='rod'){
var r=Number(v);
if(RODADAS.indexOf(r)<0||!listaDe(com(filtros(),'rod',est.rod===r?null:r)).length)return;
est.rod=est.rod===r?null:r;
normalizar();
atualizar();
}
else if(a==='clube'){
var c=Number(id);
if(!CL[c]||!listaDe(com(filtros(),'clube',est.clube===c?null:c)).length)return;
est.clube=est.clube===c?null:c;
normalizar();
atualizar();
}
else if(a==='res'){
if(v!=='m'&&v!=='e'&&v!=='v')return;
if(!listaDe(com(filtros(),'res',est.res===v?null:v)).length)return;
est.res=est.res===v?null:v;
normalizar();
atualizar();
}
else if(a==='jogo'){
var n=Number(id);
if(!lista().some(function(j){return j.n===n}))return;
est.jogo=n;
atualizar();
}
else if(a==='aba'){
if(v!=='pu'&&v!=='ar'&&v!=='es')return;
est.aba=v;
atualizar();
}
else if(a==='limpar'){est.fase='t';est.rod=null;est.clube=null;est.res=null;normalizar();atualizar()}
else if(a==='ajuda')ajuda(true);
else if(a==='ajuda-fechar')ajuda(false);
}
raiz.addEventListener('click',function(ev){
var alvo=ev.target,t=alvo.closest&&alvo.closest('[data-act]'),dentro=alvo.closest&&alvo.closest('.cx');
if(ajEl.classList.contains('on')&&!dentro){ajuda(false);return}
if(!t)return;
acao(t.getAttribute('data-act'),t.getAttribute('data-id'),t.getAttribute('data-v'));
esconderTip();
raiz.focus({preventScroll:true});
});
raiz.addEventListener('mouseover',function(ev){
var d=ev.target.closest&&ev.target.closest('[data-tip]');
if(d!==tipAlvo){tipAlvo=d;clearTimeout(tipT);if(d){tipT=setTimeout(function(){mostrarTip(d,ev)},90)}else tipEl.classList.remove('on')}
});
raiz.addEventListener('mousemove',function(ev){if(tipAlvo&&tipEl.classList.contains('on'))posTip(ev,tipAlvo)});
raiz.addEventListener('mouseleave',esconderTip);
raiz.addEventListener('scroll',function(ev){var e=ev.target;if(e&&e.classList&&e.classList.contains('rola'))marcarRolagem(e)},true);
raiz.addEventListener('focusin',function(ev){
var d=ev.target.closest&&ev.target.closest('[data-tip]');
if(d&&d!==tipAlvo&&ev.target!==raiz){tipAlvo=d;mostrarTip(d,null)}
});
raiz.addEventListener('focusout',esconderTip);
raiz.addEventListener('touchstart',function(ev){
var d=ev.target.closest&&ev.target.closest('[data-tip]');
if(d&&d!==tipAlvo){tipAlvo=d;var tc=ev.touches&&ev.touches[0];mostrarTip(d,tc?{clientX:tc.clientX,clientY:tc.clientY}:null)}
else if(!d)esconderTip();
},{passive:true});
function tecla(k,ctrl){
if(k==='?'||(k==='h'&&!ctrl)){ajuda();return true}
if(ajEl.classList.contains('on')){if(k==='Escape'||k==='Enter'||k===' '){ajuda(false);return true}return false}
if(k==='ArrowDown')return mover(1);
if(k==='ArrowUp')return mover(-1);
if(k==='Escape'||k==='Backspace'){
if(est.res!==null){est.res=null;normalizar();atualizar();return true}
if(est.clube!==null){est.clube=null;normalizar();atualizar();return true}
if(est.rod!==null){est.rod=null;normalizar();atualizar();return true}
if(est.fase!=='t'){est.fase='t';normalizar();atualizar();return true}
}
return false;
}
document.addEventListener('keydown',function(ev){
if(!raiz.offsetParent)return;
if(tecla(ev.key,ev.ctrlKey||ev.metaKey))ev.preventDefault();
});
var goT=null;
function entrar(){
clearTimeout(goT);
raiz.classList.remove('go');
void raiz.offsetWidth;
raiz.classList.add('go');
goT=setTimeout(function(){raiz.classList.remove('go')},1500);
ajustar();
atualizar();
}
montarAjuda();montarRodape();
atualizar();
if(window.PA&&window.PA.shell)window.PA.mods.jg={entrar:entrar};
else entrar();
if(/[?&]debug/.test(location.search))window.__jgx={D:D,CL:CL,est:est,acao:acao,tecla:tecla,atualizar:atualizar,tipHtml:tipHtml,lista:lista,listaDe:listaDe,lances:lances,trocas:trocas,resumoJogo:resumoJogo,geometria:geometria,nomeRodada:nomeRodada,RODADAS:RODADAS,ORDEM_CLUBES:ORDEM_CLUBES};
})();
