<script>

var M=D.meta,CL={},LG={};

{r:'Jogos',c:COR.ciano,v:num(r.n),s:jogosSub,t:['Jogos','Partidas disputadas no recorte escolhido (um jogo é uma partida da A1 2026).',linhasTip(porFase(function(x){return num(x.n)}))]},
